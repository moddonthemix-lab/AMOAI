<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMO Dashboard</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1b1b1b; --mut:#6b6b6b; --line:#e4e4e0; --acc:#2f6fed; --good:#1f9d55; --bad:#d64545; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --card:#1a1c1f; --ink:#ececec; --mut:#9a9a9a; --line:#2a2d31; --acc:#6c9bff; --good:#3ecf7a; --bad:#ff6b6b; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:20px 16px 8px; max-width:1200px; margin:auto; flex-wrap:wrap; }
  h1 { margin:0; font-size:22px; } .mut { color:var(--mut); }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; padding:8px 16px 32px; max-width:1200px; margin:auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0; }
  .card h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); }
  .big { font-size:28px; font-weight:650; font-variant-numeric:tabular-nums; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .row:first-of-type { border-top:0; }
  .pos { color:var(--good); } .neg { color:var(--bad); }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:8px 0 4px; }
  .bar > i { display:block; height:100%; background:var(--acc); }
  .wide { grid-column:1/-1; }
  form.ask { display:flex; gap:8px; } form.ask input { flex:1; min-width:0; }
  .icon { background:var(--bg); color:var(--ink); border:1px solid var(--line); min-width:44px; }
  .icon.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  #mic.rec { background:var(--bad); color:#fff; border-color:var(--bad); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  #log { max-height:340px; overflow-y:auto; margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .msg { white-space:pre-wrap; padding:8px 12px; border-radius:10px; max-width:85%; overflow-wrap:anywhere; }
  .msg.you { align-self:flex-end; background:var(--acc); color:#fff; }
  .msg.amo { align-self:flex-start; background:var(--bg); border:1px solid var(--line); }
  .msg .tools { display:block; font-size:12px; color:var(--mut); margin-top:4px; }
  input, button, select, textarea { font:inherit; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  button { background:var(--acc); color:#fff; border:0; cursor:pointer; }
  #answer { white-space:pre-wrap; margin-top:10px; }
  .chk { cursor:pointer; } svg { width:100%; height:40px; display:block; }
  .chatwrap { max-width:1200px; margin:auto; padding:8px 16px; }
  nav.tabs { display:flex; gap:6px; padding:4px 16px 8px; max-width:1200px; margin:auto; overflow-x:auto; scrollbar-width:none; }
  nav.tabs button { background:transparent; color:var(--mut); border:1px solid var(--line); border-radius:999px; padding:7px 14px; white-space:nowrap; }
  nav.tabs button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  #manage { display:block; }
  .panel { margin-bottom:14px; }
  .panel-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .panel-head h2 { margin:0 auto 0 0; }
  .panel-head input { width:180px; max-width:100%; padding:7px 10px; }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:8px 8px; border-top:1px solid var(--line); vertical-align:top; }
  td { white-space:nowrap; } td.wrap { white-space:normal; min-width:160px; }
  th { font-size:12px; color:var(--mut); font-weight:600; border-top:0; white-space:nowrap; }
  td.act { white-space:nowrap; text-align:right; }
  .small { padding:5px 9px; font-size:13px; border-radius:7px; }
  .ghost { background:var(--bg); color:var(--ink); border:1px solid var(--line); }
  .danger { background:transparent; color:var(--bad); border:1px solid var(--line); }
  form.edit { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; padding:12px; margin-bottom:10px;
              border:1px solid var(--acc); border-radius:10px; background:var(--bg); }
  form.edit label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--mut); }
  form.edit .full { grid-column:1/-1; }
  form.edit input, form.edit select, form.edit textarea { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; }
  form.edit textarea { min-height:60px; resize:vertical; }
  form.edit .btns { grid-column:1/-1; display:flex; gap:8px; justify-content:flex-end; }
  .err { color:var(--bad); grid-column:1/-1; }
  .empty { color:var(--mut); padding:10px 0; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px;
           border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:calc(100% - 32px); }
  #toast.show { opacity:1; }
  .chart-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .chart-bar input { width:140px; text-transform:uppercase; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { background:transparent; color:var(--ink); border:0; border-radius:0; padding:8px 12px; }
  .seg button.on { background:var(--ink); color:var(--bg); }
  .chart-grid { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:14px; }
  @media (max-width: 860px) { .chart-grid { grid-template-columns:1fr; } }
  #chart svg { width:100%; height:auto; display:block; }
  #chart .lbl { font-size:11px; fill:var(--mut); font-family:system-ui,sans-serif; }
  #chart .num { font-size:11px; font-weight:700; font-family:system-ui,sans-serif; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px; }
  .badge { padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--line); }
  .badge.up { color:var(--good); border-color:var(--good); } .badge.down { color:var(--bad); border-color:var(--bad); }
  #thesis { white-space:pre-wrap; font-size:14px; line-height:1.5; }
  .bias { font-size:18px; font-weight:700; margin:2px 0 4px; }
</style>
</head>
<body>
<header>
  <h1 id="title">AMO <a href="/face" target="_blank" style="font-size:14px;font-weight:500;margin-left:8px;color:var(--acc)">Face ↗</a></h1>
  <span class="mut" id="date"></span>
</header>
<div class="chatwrap">
  <section class="card">
    <form class="ask" id="ask">
      <button type="button" class="icon" id="mic" title="Talk to AMO (click to start, click again to send)" aria-label="Talk">🎤</button>
      <input id="q" placeholder="Talk or type… (e.g. “book Jay Friday 7pm, 3 hours at $50”)" autocomplete="off">
      <button>Send</button>
      <button type="button" class="icon" id="speak" title="Read AMO's replies out loud" aria-label="Speak replies">🔊</button>
    </form>
    <div id="log" aria-live="polite"></div>
    <div id="answer" class="mut"></div>
  </section>
</div>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-tab="overview" class="on">Overview</button>
  <button data-tab="goals">Goals</button>
  <button data-tab="studio">Studio</button>
  <button data-tab="reselling">Reselling</button>
  <button data-tab="trading">Trading</button>
  <button data-tab="charts">Charts</button>
  <button data-tab="cravvr">Cravvr</button>
  <button data-tab="memory">Memory</button>
</nav>
<main id="manage" hidden></main>
<main id="overview">
  <section class="card"><h2>Revenue · month</h2><div class="big" id="rev-month">–</div>
    <div class="bar"><i id="rev-bar" style="width:0"></i></div><div class="mut" id="rev-target"></div>
    <svg id="spark" viewBox="0 0 140 40" preserveAspectRatio="none"></svg><div id="rev-biz"></div></section>
  <section class="card"><h2>Studio · today</h2><div id="studio"></div></section>
  <section class="card"><h2>Goals</h2><div id="goals"></div></section>
  <section class="card"><h2>Trading</h2><div id="trading"></div></section>
  <section class="card"><h2>Reselling</h2><div id="resale"></div></section>
  <section class="card"><h2>Notifications</h2><div id="notes"></div></section>
</main>
<div id="toast" role="status"></div>
<script>
const $ = id => document.getElementById(id);
const money = n => (n < 0 ? "-$" : "$") + Math.abs(n || 0).toLocaleString(undefined, {maximumFractionDigits: 0});
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let key = ""; try { key = localStorage.getItem("amo_key") || ""; } catch {}

function cleanKey(v) {
  // Accept a pasted "AMO_API_KEY=abc", quotes or stray spaces.
  return (v || "").trim().replace(/^AMO_API_KEY\s*=\s*/i, "").replace(/^["']|["']$/g, "").trim();
}
async function api(path, opts = {}, tries = 0) {
  const r = await fetch(path, {...opts, headers: {"Content-Type": "application/json", ...(key ? {Authorization: "Bearer " + key} : {})}});
  if (r.status === 401) {
    if (tries >= 3) {
      try { localStorage.removeItem("amo_key"); } catch {}
      throw new Error("AMO didn't accept that key. In Terminal run:  grep AMO_API_KEY ~/AMOAI/.env  and paste only the part after =. If it still fails, restart AMO:  cd ~/AMOAI && ./scripts/mac-autostart.sh install");
    }
    const entered = prompt((tries ? "That key didn't work. " : "") + "Paste your AMO API key (the part after AMO_API_KEY=):");
    if (entered === null) throw new Error("An API key is needed to open the dashboard.");
    key = cleanKey(entered);
    try { localStorage.setItem("amo_key", key); } catch {}
    return api(path, opts, tries + 1);
  }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
const row = (l, r, cls = "") => `<div class="row"><span>${l}</span><span class="${cls}">${r}</span></div>`;
const sign = n => n > 0 ? "pos" : n < 0 ? "neg" : "";

async function load() {
  const d = await api("/api/dashboard");
  $("date").textContent = `${d.weekday} · ${d.date}`;
  const rv = d.revenue;
  $("rev-month").textContent = money(rv.month);
  $("rev-bar").style.width = rv.month_pct ? Math.min(100, rv.month_pct * 100) + "%" : "0";
  $("rev-target").textContent = rv.month_target ? `${Math.round(rv.month_pct * 100)}% of ${money(rv.month_target)} · week ${money(rv.week)} · today ${money(rv.today)}` : `week ${money(rv.week)} · today ${money(rv.today)}`;
  const max = Math.max(1, ...rv.spark.map(Math.abs));
  $("spark").innerHTML = `<polyline fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${rv.spark.map((v, i) => `${i * 140 / (rv.spark.length - 1)},${38 - (v / max) * 34}`).join(" ")}"/>`;
  $("rev-biz").innerHTML = Object.entries(rv.by_business).map(([k, v]) => row(k, money(v), sign(v))).join("");
  $("studio").innerHTML = (d.studio.today.length ? d.studio.today.map(s => row(`${s.time} ${esc(s.client)}`, `${esc(s.service)} · ${s.hours}h`)).join("") : `<div class="mut">No sessions today</div>`)
    + row("Next 7 days", d.studio.upcoming_7d) + row("Unpaid sessions", d.studio.unpaid, d.studio.unpaid ? "neg" : "");
  $("goals").innerHTML = d.goals.length ? d.goals.map(g => `<div class="row chk" data-id="${g.id}"><span>${g.done ? "✅" : "⬜️"} ${esc(g.title)}${g.cadence && g.cadence !== "daily" ? ` <span class="mut">(${esc(g.cadence)})</span>` : ""}</span><span class="mut">🔥 ${g.streak}</span></div>`).join("") : `<div class="mut">No goals yet — tell AMO “add a daily goal: …”</div>`;
  document.querySelectorAll(".chk").forEach(el => el.onclick = async () => { await api(`/api/goals/${el.dataset.id}/checkin`, {method: "POST", body: "{}"}); load(); });
  $("trading").innerHTML = row("Today P&L", money(d.trading.today_pnl), sign(d.trading.today_pnl)) + row("Week P&L", money(d.trading.week), sign(d.trading.week)) + row("Open positions", d.trading.open_positions);
  $("resale").innerHTML = row("Items in inventory", d.reselling.inventory) + row("Stale (30+ days)", d.reselling.stale, d.reselling.stale ? "neg" : "") + row("Cravvr open tasks", d.cravvr.open_tasks);
  $("notes").innerHTML = d.notifications.length ? d.notifications.map(n => `<div class="row"><span><b>${esc(n.title)}</b><br><span class="mut">${esc(n.body).replace(/\n/g, "<br>")}</span></span></div>`).join("") + `<button id="clear" style="margin-top:8px">Mark all read</button>` : `<div class="mut">All caught up</div>`;
  if ($("clear")) $("clear").onclick = async () => { await api("/api/notifications/read", {method: "POST"}); load(); };
}

const history = [];
let speakOn = true; try { speakOn = localStorage.getItem("amo_speak") !== "0"; } catch {}
const paintSpeak = () => { $("speak").classList.toggle("on", speakOn); $("speak").textContent = speakOn ? "🔊" : "🔇"; };
paintSpeak();
$("speak").onclick = () => {
  speakOn = !speakOn; paintSpeak();
  try { localStorage.setItem("amo_speak", speakOn ? "1" : "0"); } catch {}
  if (!speakOn) stopSpeaking();
};

function addMsg(who, text, tools) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  if (tools && tools.length) { const t = document.createElement("span"); t.className = "tools"; t.textContent = "↳ " + tools.join(", "); el.appendChild(t); }
  $("log").appendChild(el); $("log").scrollTop = $("log").scrollHeight;
  return el;
}

// ---- speaking: AMO's local voice (Piper / macOS voice), browser voice as a fallback
let player = null;
function stopSpeaking() { if (player) { player.pause(); player = null; } try { speechSynthesis.cancel(); } catch {} }
async function speak(text) {
  if (!speakOn || !text) return;
  // Let a short "Got it" finish instead of cutting it off mid-word.
  if (player && !player.paused) await new Promise(res => { player.onended = res; setTimeout(res, 2500); });
  stopSpeaking();
  try {
    const r = await fetch("/v1/audio/speech", {method: "POST", headers: {"Content-Type": "application/json", ...(key ? {Authorization: "Bearer " + key} : {})}, body: JSON.stringify({input: text})});
    if (!r.ok) throw new Error(r.statusText);
    player = new Audio(URL.createObjectURL(await r.blob()));
    await player.play();
  } catch {
    try { const u = new SpeechSynthesisUtterance(text.replace(/[*#_`>|]/g, "")); speechSynthesis.speak(u); } catch {}
  }
}

// "Got it" / "Okay, let me think" — played while AMO works on the real answer.
async function acknowledge(message) { return playAck("/api/ack?text=" + encodeURIComponent(message)); }
async function playAck(url) {
  if (!speakOn) return;
  try {
    const r = await fetch(url, {headers: key ? {Authorization: "Bearer " + key} : {}});
    if (r.status !== 200) return;
    stopSpeaking();
    player = new Audio(URL.createObjectURL(await r.blob()));
    await player.play();
  } catch {}
}

async function send(message, channel) {
  addMsg("you", message);
  const pending = addMsg("amo", "…");
  let waitTimers = [];
  if (channel === "voice") {
    acknowledge(message);
    // Long wait? "Still working on it." then "Almost there."
    waitTimers = [7000, 21000].map((ms, n) => setTimeout(() => playAck(`/api/ack?kind=still&n=${n}`), ms));
  }
  try {
    const r = await api("/api/ask", {method: "POST", body: JSON.stringify({message, history: history.slice(-10), channel})});
    waitTimers.forEach(clearTimeout);
    history.push({role: "user", content: message}, {role: "assistant", content: r.content});
    pending.remove();
    addMsg("amo", r.content, r.tool_calls.map(t => t.name));
    speak(r.content);
    load();
  } catch (err) { waitTimers.forEach(clearTimeout); pending.textContent = "Error: " + err.message; }
}
$("ask").onsubmit = e => {
  e.preventDefault();
  const message = $("q").value.trim(); if (!message) return;
  $("q").value = "";
  send(message, "webui");
};

// ---- talking: record in the browser, transcribe with AMO's local Whisper
let rec = null, chunks = [];
$("mic").onclick = async () => {
  if (rec && rec.state === "recording") { rec.stop(); return; }
  stopSpeaking();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch { $("answer").textContent = "Microphone blocked — allow it for this page (click the icon in the address bar) and try again."; return; }
  chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    $("mic").classList.remove("rec"); $("mic").textContent = "🎤";
    const blob = new Blob(chunks, {type: rec.mimeType || "audio/webm"});
    const ext = (rec.mimeType || "").includes("mp4") ? "m4a" : "webm";
    $("answer").textContent = "transcribing…";
    try {
      const fd = new FormData(); fd.append("file", blob, "speech." + ext); fd.append("model", "whisper-1");
      const r = await fetch("/v1/audio/transcriptions", {method: "POST", body: fd, headers: key ? {Authorization: "Bearer " + key} : {}});
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.detail || r.statusText);
      $("answer").textContent = "";
      if (d.text && d.text.trim()) send(d.text.trim(), "voice");
      else $("answer").textContent = "Didn't catch that — try again.";
    } catch (err) { $("answer").textContent = "Voice input isn't working: " + err.message + " — you can still type."; }
  };
  rec.start();
  $("mic").classList.add("rec"); $("mic").textContent = "■";
  $("answer").textContent = "listening… click ■ when you're done";
};

// ================================================================ manage tabs
const TABS = {
  goals: ["goals"],
  studio: ["sessions", "clients", "payments"],
  reselling: ["resale"],
  trading: ["trades", "watchlist", "rules"],
  cravvr: ["cravvr"],
  memory: ["memories"],
};
// Extra computed columns per kind (shown after the editable ones).
const EXTRA = {
  goals: [["streak", "Streak", r => r.streak ? `🔥 ${r.streak}` : ""]],
  sessions: [["total", "Total", r => r.total ? money(r.total) : ""]],
  resale: [["profit", "Profit", r => r.profit == null ? "" : `<span class="${sign(r.profit)}">${money(r.profit)}</span>`]],
  trades: [["pnl", "P&L", r => r.pnl == null ? "open" : `<span class="${sign(r.pnl)}">${money(r.pnl)}</span>`]],
};
let SCHEMA = null, CLIENTS = [], tab = "overview", editing = null, searches = {};

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}

function cell(f, r) {
  let v = r[f.key];
  if (f.type === "client") return esc(r.client_name || "");
  if (v == null || v === "") return "";
  if (f.type === "number" && ["cost","list_price","sold_price","rate","amount","fees","shipping"].includes(f.key)) return money(v);
  if (f.type === "datetime") return esc(String(v).slice(0, 16).replace("T", " "));
  if (f.type === "bool") return v ? "yes" : "no";
  if (f.type === "longtext") return esc(String(v).length > 80 ? String(v).slice(0, 80) + "…" : v);
  return esc(v);
}

function input(f, v) {
  const val = v == null ? "" : v;
  const name = `name="${f.key}"`;
  const req = f.required ? "required" : "";
  if (f.type === "select") return `<select ${name} ${req}>${f.required ? "" : '<option value=""></option>'}${f.options.map(o => `<option ${o === val ? "selected" : ""}>${o}</option>`).join("")}</select>`;
  if (f.type === "client") return `<select ${name} ${req}><option value=""></option>${CLIENTS.map(c => `<option value="${c.id}" ${c.id === val ? "selected" : ""}>${esc(c.artist_name ? `${c.artist_name} (${c.name})` : c.name)}</option>`).join("")}</select>`;
  if (f.type === "longtext") return `<textarea ${name} ${req}>${esc(val)}</textarea>`;
  if (f.type === "bool") return `<select ${name}><option value=""></option><option value="1" ${val === 1 ? "selected" : ""}>yes</option><option value="0" ${val === 0 ? "selected" : ""}>no</option></select>`;
  const type = f.type === "date" ? "date" : f.type === "datetime" ? "datetime-local" : (f.type === "number" || f.type === "int") ? "number" : "text";
  const shown = f.type === "datetime" ? String(val).slice(0, 16) : val;
  return `<input type="${type}" ${type === "number" ? 'step="any"' : ""} ${name} value="${esc(shown)}" ${req}>`;
}

function formHtml(kind, row) {
  const ent = SCHEMA[kind];
  return `<form class="edit" data-kind="${kind}" data-id="${row ? row.id : ""}">
    ${ent.fields.map(f => `<label class="${f.type === "longtext" ? "full" : ""}">${esc(f.label)}${f.required ? " *" : ""}${input(f, row ? row[f.key] : (f.type === "select" && f.required ? f.options[0] : ""))}</label>`).join("")}
    <div class="err" hidden></div>
    <div class="btns"><button type="button" class="ghost" data-act="cancel">Cancel</button><button>${row ? "Save changes" : "Add " + esc(ent.label)}</button></div>
  </form>`;
}

async function renderPanel(kind) {
  const ent = SCHEMA[kind];
  const q = searches[kind] || "";
  const rows = await api(`/api/records/${kind}` + (q ? `?q=${encodeURIComponent(q)}` : ""));
  const cols = ent.fields.filter(f => f.show);
  const extra = EXTRA[kind] || [];
  const isEditingHere = editing && editing.kind === kind;
  const editRow = isEditingHere && editing.id ? rows.find(r => r.id === editing.id) : null;
  return `<section class="card panel" data-panel="${kind}">
    <div class="panel-head"><h2>${esc(ent.title)} <span class="mut">(${rows.length})</span></h2>
      <input type="search" placeholder="Search…" data-search="${kind}" value="${esc(q)}">
      <button class="small" data-act="add" data-kind="${kind}">+ Add</button></div>
    ${isEditingHere && (!editing.id || editRow) ? formHtml(kind, editRow) : ""}
    ${rows.length ? `<div class="tablewrap"><table>
      <thead><tr>${cols.map(f => `<th>${esc(f.label)}</th>`).join("")}${extra.map(e => `<th>${e[1]}</th>`).join("")}<th></th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        ${cols.map(f => `<td class="${f.type === "longtext" || f.key === "title" || f.key === "rule" || f.key === "content" ? "wrap" : ""}">${cell(f, r)}</td>`).join("")}${extra.map(e => `<td>${e[2](r)}</td>`).join("")}
        <td class="act">
          ${kind === "goals" ? `<button class="small ghost" data-act="checkin" data-id="${r.id}" title="Done today">${r.done_today ? "✅" : "⬜️"}</button>` : ""}
          <button class="small ghost" data-act="edit" data-kind="${kind}" data-id="${r.id}" aria-label="Edit">Edit</button>
          <button class="small danger" data-act="delete" data-kind="${kind}" data-id="${r.id}" aria-label="Delete">Delete</button>
        </td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty">Nothing here yet — click “+ Add” or just tell AMO.</div>`}
  </section>`;
}

async function renderManage() {
  if (tab === "overview") return;
  if (tab === "charts") return renderCharts();
  if (!SCHEMA) SCHEMA = await api("/api/schema");
  if (TABS[tab].some(k => SCHEMA[k].fields.some(f => f.type === "client"))) CLIENTS = await api("/api/records/clients");
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.search : null;
  const html = (await Promise.all(TABS[tab].map(renderPanel))).join("");
  // Don't wipe a form the user is typing in when a live update arrives.
  if (document.querySelector("#manage form.edit") && renderManage.live) return;
  $("manage").innerHTML = html;
  if (focused) { const el = document.querySelector(`[data-search="${focused}"]`); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
}

function showTab(name) {
  tab = TABS[name] || name === "overview" || name === "charts" ? name : "overview";
  if (tab !== "charts") $("manage").innerHTML = "";
  editing = null;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("overview").hidden = tab !== "overview";
  $("manage").hidden = tab === "overview";
  try { history.replaceState(null, "", "#" + tab); } catch {}
  (tab === "overview" ? load() : renderManage()).catch(e => toast("Error: " + e.message));
}
$("tabs").onclick = e => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); };

$("manage").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const act = b.dataset.act, kind = b.dataset.kind, id = b.dataset.id ? Number(b.dataset.id) : null;
  try {
    if (act === "add") { editing = {kind, id: null}; await renderManage(); document.querySelector("#manage form.edit input, #manage form.edit select")?.focus(); }
    else if (act === "edit") { editing = {kind, id}; await renderManage(); }
    else if (act === "cancel") { editing = null; await renderManage(); }
    else if (act === "checkin") { await api(`/api/goals/${id}/checkin`, {method: "POST", body: "{}"}); toast("Checked in ✓"); await renderManage(); }
    else if (act === "delete") {
      const label = SCHEMA[kind].label;
      const name = b.closest("tr").querySelector("td").textContent.trim();
      if (!confirm(`Delete ${label} “${name}”? This can't be undone.`)) return;
      const r = await api(`/api/records/${kind}/${id}`, {method: "DELETE"});
      toast(`Deleted ${r.label} “${r.name}”`); await renderManage();
    }
  } catch (err) { toast("Error: " + err.message); }
});

$("manage").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, kind = form.dataset.kind, id = form.dataset.id;
  const data = {};
  for (const el of form.elements) if (el.name) data[el.name] = el.value === "" ? null : el.value;
  try {
    if (id) { await api(`/api/records/${kind}/${id}`, {method: "PATCH", body: JSON.stringify(data)}); toast("Saved ✓"); }
    else { await api(`/api/records/${kind}`, {method: "POST", body: JSON.stringify(data)}); toast(`Added ${SCHEMA[kind].label} ✓`); }
    editing = null; await renderManage();
  } catch (err) { const box = form.querySelector(".err"); box.hidden = false; box.textContent = err.message; }
});

let searchTimer;
$("manage").addEventListener("input", e => {
  const k = e.target.dataset.search; if (!k) return;
  searches[k] = e.target.value;
  clearTimeout(searchTimer); searchTimer = setTimeout(() => renderManage().catch(() => {}), 250);
});


// ================================================================ charts (The Strat)
let chartSym = "SPY", chartTf = "D", lastDisplayAt = null;
const TF_LABEL = {D: "Daily", W: "Weekly", M: "Monthly", "60": "60m"};
const NUM_COLOR = {"1": "var(--mut)", "2U": "var(--good)", "2D": "var(--bad)", "3": "#a855f7"};

function svgChart(data) {
  const narrow = window.innerWidth < 700;
  const bars = data.bars.slice(narrow ? -40 : -80);
  const W = 1000, H = 440, padL = 8, padR = 78, padT = 22, padB = 22;
  const hi = Math.max(...bars.map(b => b.h)), lo = Math.min(...bars.map(b => b.l));
  const span = (hi - lo) || 1, top = hi + span * 0.04, bot = lo - span * 0.04;
  const y = v => padT + (top - v) / (top - bot) * (H - padT - padB);
  const step = (W - padL - padR) / bars.length, bw = Math.max(2, step * 0.62);
  const dec = hi >= 1000 ? 0 : hi >= 1 ? 2 : 4;
  const f = v => v.toLocaleString(undefined, {minimumFractionDigits: dec, maximumFractionDigits: dec});
  let g = "";
  for (let i = 0; i <= 5; i++) {               // price grid
    const v = bot + (top - bot) * i / 5;
    g += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>
          <text class="lbl" x="${W - padR + 6}" y="${y(v) + 4}">${f(v)}</text>`;
  }
  const cur = bars[bars.length - 1], prev = bars[bars.length - 2];
  // Key levels: lines across the chart, labels stacked on the right so they never overlap.
  const levels = [[cur.o, `${TF_LABEL[data.tf]} open`, "var(--acc)", "2 3"]];
  if (prev) levels.push([prev.h, "prior high", "var(--good)", "6 4"], [prev.l, "prior low", "var(--bad)", "6 4"]);
  levels.sort((a, b) => y(a[0]) - y(b[0]));
  let lastY = -99;
  for (const [v, text, color, dash] of levels) {
    const ly = Math.max(y(v) - 4, lastY + 14); lastY = ly;
    g += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="${color}" stroke-dasharray="${dash}" stroke-width="1.2"/>
          <rect x="${padL + 2}" y="${ly - 11}" width="${(text.length + f(v).length + 1) * 6.4 + 8}" height="15" rx="3" fill="var(--card)" opacity=".9"/>
          <text class="lbl" x="${padL + 6}" y="${ly}" style="fill:${color};font-weight:600">${text} ${f(v)}</text>`;
  }
  bars.forEach((b, i) => {
    const x = padL + step * i + step / 2, up = b.c >= b.o, col = up ? "var(--good)" : "var(--bad)";
    const yo = y(b.o), yc = y(b.c);
    g += `<line x1="${x}" x2="${x}" y1="${y(b.h)}" y2="${y(b.l)}" stroke="${col}"/>
          <rect x="${x - bw / 2}" y="${Math.min(yo, yc)}" width="${bw}" height="${Math.max(1, Math.abs(yc - yo))}" fill="${col}"/>`;
    if (b.s && (!narrow || i >= bars.length - 25))
      g += `<text class="num" x="${x}" y="${y(b.h) - 5}" text-anchor="middle" style="fill:${NUM_COLOR[b.s]}">${b.s}</text>`;
  });
  g += `<line x1="${padL}" x2="${W - padR}" y1="${y(cur.c)}" y2="${y(cur.c)}" stroke="var(--ink)" stroke-width=".6"/>
        <rect x="${W - padR + 2}" y="${y(cur.c) - 9}" width="${padR - 4}" height="18" rx="4" fill="var(--ink)"/>
        <text x="${W - padR + 6}" y="${y(cur.c) + 4}" style="fill:var(--bg);font-size:11px;font-weight:700">${f(cur.c)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(data.symbol)} ${TF_LABEL[data.tf]} chart">${g}</svg>`;
}

async function renderCharts() {
  const m = $("manage");
  if (!m.querySelector("#chartcard")) {
    m.innerHTML = `<section class="card" id="chartcard">
      <form class="chart-bar" id="chartform">
        <input id="sym" value="${esc(chartSym)}" aria-label="Ticker" placeholder="SPY, NQ, BTC…">
        <button>Go</button>
        <span class="seg" id="tfs">${["60", "D", "W", "M"].map(t => `<button type="button" data-tf="${t}">${TF_LABEL[t]}</button>`).join("")}</span>
        <span class="mut" id="chartname"></span>
      </form>
      <div class="chart-grid"><div id="chart" class="mut">Loading…</div>
        <div><div class="bias" id="bias"></div><div class="badges" id="badges"></div><div id="thesis" class="mut"></div></div></div>
    </section>`;
    $("chartform").onsubmit = e => { e.preventDefault(); chartSym = $("sym").value.trim().toUpperCase() || "SPY"; renderCharts(); };
    $("tfs").onclick = e => { const b = e.target.closest("button[data-tf]"); if (b) { chartTf = b.dataset.tf; renderCharts(); } };
  }
  $("sym").value = chartSym;
  document.querySelectorAll("#tfs button").forEach(b => b.classList.toggle("on", b.dataset.tf === chartTf));
  $("chart").textContent = "Loading…"; $("thesis").textContent = "Reading The Strat…";
  try {
    const [bars, rep] = await Promise.all([api(`/api/market/${encodeURIComponent(chartSym)}?tf=${chartTf}`),
                                           api(`/api/strat/${encodeURIComponent(chartSym)}`)]);
    $("chart").innerHTML = svgChart(bars);
    $("chartname").textContent = bars.name !== bars.symbol ? `${bars.name} · ${bars.symbol}` : bars.symbol;
    $("bias").innerHTML = `<span class="${rep.bias.includes("bull") ? "pos" : rep.bias.includes("bear") ? "neg" : ""}">${esc(rep.bias.toUpperCase())}</span>`;
    $("badges").innerHTML = ["Q", "M", "W", "D", "60"].filter(t => rep.timeframes[t]).map(t => {
      const tf = rep.timeframes[t];
      return `<span class="badge ${tf.up ? "up" : "down"}" title="price vs ${t} open ${tf.open}">${t === "60" ? "60m" : t} ${tf.arrow} ${tf.type || ""}</span>`;
    }).join("");
    $("thesis").textContent = rep.thesis.split("\n").slice(2).join("\n");
    $("thesis").classList.remove("mut");
  } catch (e) { $("chart").textContent = "Couldn't load chart: " + e.message; $("thesis").textContent = ""; }
}

// ---- live updates: anything changed by voice, chat or another window shows up within ~2s
let lastVersion = null;
async function watchChanges() {
  try {
    const {v, display} = await api("/api/version");
    // AMO asked to show something (e.g. "pull up the NQ chart")
    if (display && display.at !== lastDisplayAt) {
      const first = lastDisplayAt === null && lastVersion === null;
      lastDisplayAt = display.at;
      if (!first && display.chart) { chartSym = display.chart; chartTf = display.tf || "D"; showTab("charts"); lastVersion = v; }
    }
    if (lastVersion !== null && v !== lastVersion && tab !== "charts") {
      if (tab === "overview") await load();
      else { renderManage.live = true; try { await renderManage(); } finally { renderManage.live = false; } }
    }
    lastVersion = v;
  } catch {}
  setTimeout(watchChanges, 2000);
}

showTab((location.hash || "#overview").slice(1));
watchChanges();
setInterval(() => { if (tab === "overview") load().catch(() => {}); }, 60000);
</script>
