<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMO</title>
<style>
  :root { --bg:#07090c; --glow:#5ee7ff; --dim:#2a6f80; --text:#e8f9ff; --mut:#5b7c86; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
               font-family:ui-rounded, system-ui, -apple-system, "SF Pro Rounded", sans-serif; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2vh; padding:16px; }
  svg { width:min(92vw, 120vh); height:auto; max-height:62vh; display:block; overflow:visible; }
  .eye, .mouth { fill:var(--glow); transition:fill .4s; }
  .lid { fill:var(--bg); }
  body.asleep .eye, body.asleep .mouth { fill:var(--dim); }
  #ring { fill:none; stroke:var(--glow); stroke-width:2; opacity:0; }
  #captions { min-height:12vh; max-width:min(92vw, 1000px); text-align:center; font-size:clamp(20px, 4.2vw, 46px);
              line-height:1.25; font-weight:600; letter-spacing:.01em; transition:opacity .6s; }
  #captions .w { opacity:0; transition:opacity .12s, color .2s; color:var(--mut); }
  #captions .w.on { opacity:1; color:var(--text); }
  #captions .w.now { color:var(--glow); text-shadow:0 0 18px rgba(94,231,255,.55); }
  #captions.fade { opacity:0; }
  .dots { display:inline-flex; gap:.35em; }
  .dots i { width:.32em; height:.32em; border-radius:50%; background:var(--glow); opacity:.25; animation:dot 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay:.2s; } .dots i:nth-child(3) { animation-delay:.4s; }
  @keyframes dot { 30% { opacity:1; transform:translateY(-.15em); } }
  #status { position:fixed; bottom:12px; left:0; right:0; text-align:center; color:var(--mut); font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
  #zz { position:absolute; font-size:clamp(18px,3vw,32px); color:var(--dim); font-weight:700; }
  @media (prefers-reduced-motion: reduce) { #captions .w { transition:none; } }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 400 260" aria-label="AMO's face">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <circle id="ring" cx="200" cy="120" r="150"/>
    <g filter="url(#glow)">
      <g id="eyeL"><rect class="eye" id="eyeLr" x="-30" y="-44" width="60" height="88" rx="30"/></g>
      <g id="eyeR"><rect class="eye" id="eyeRr" x="-30" y="-44" width="60" height="88" rx="30"/></g>
      <path class="mouth" id="mouth"/>
    </g>
  </svg>
  <div id="captions" aria-live="polite"></div>
</main>
<div id="status">connecting…</div>
<script>
const $ = id => document.getElementById(id);
let key = ""; try { key = localStorage.getItem("amo_key") || ""; } catch {}
const auth = key ? {Authorization: "Bearer " + key} : {};

// ---------------------------------------------------------------- state from AMO
let state = "idle", stateAt = 0, last = -1, clockOffset = 0;
const sayings = [];            // {start, dur, env, step, words, el}
async function poll() {
  try {
    const t0 = Date.now();
    const r = await fetch(`/api/face/events?after=${last}`, {headers: auth});
    if (r.status === 401) { $("status").dataset.err = 1; $("status").textContent = "needs the API key (open the dashboard once on this device)"; return setTimeout(poll, 3000); }
    const d = await r.json();
    clockOffset = d.now - (t0 + Date.now()) / 2;      // server clock minus ours
    if (last >= 0) d.events.forEach(handle);
    last = d.last;
    delete $("status").dataset.err;
  } catch { $("status").dataset.err = 1; $("status").textContent = "can't reach AMO — is it running?"; }
  setTimeout(poll, 120);
}
const now = () => Date.now() + clockOffset;

function handle(ev) {
  if (ev.kind === "state") { setState(ev.state); return; }
  if (ev.kind === "say") showSentence(ev);
}
function setState(s) {
  state = s; stateAt = now();
  document.body.classList.toggle("asleep", s === "asleep");
  if (s === "thinking" && !speakingNow()) $("captions").innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  if (s === "listening") { $("captions").classList.remove("fade"); $("captions").innerHTML = ""; }
}

// ---------------------------------------------------------------- captions, word by word
let clearTimer = null;
function showSentence(ev) {
  const box = $("captions");
  clearTimeout(clearTimer);
  box.classList.remove("fade");
  box.innerHTML = ev.words.map(w => `<span class="w">${w.w.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</span>`).join(" ");
  const spans = [...box.querySelectorAll(".w")];
  sayings.push({...ev, spans});
  ev.words.forEach((w, i) => {
    setTimeout(() => {
      spans.forEach((s, j) => { if (j < i) s.classList.remove("now"); });
      spans[i].classList.add("on", "now");
    }, Math.max(0, ev.start + w.t - now()));
  });
  clearTimer = setTimeout(() => {
    spans.forEach(s => s.classList.remove("now"));
    clearTimer = setTimeout(() => { if (!speakingNow()) box.classList.add("fade"); }, 2800);
  }, Math.max(0, ev.start + ev.dur - now()));
}
function speakingNow() {
  const t = now();
  return sayings.some(s => t >= s.start && t <= s.start + s.dur);
}
function loudness() {   // 0..1 from the voice's loudness curve right now
  const t = now();
  for (let i = sayings.length - 1; i >= 0; i--) {
    const s = sayings[i];
    if (t >= s.start && t <= s.start + s.dur) return s.env[Math.floor((t - s.start) / s.step)] || 0;
  }
  while (sayings.length > 8) sayings.shift();
  return null;
}

// ---------------------------------------------------------------- the face
let blinkAt = performance.now() + 2500, gaze = {x: 0, y: 0}, target = {x: 0, y: 0}, nextGaze = 0, mouthOpen = 0;
function frame(ts) {
  const amp = loudness(), speaking = amp !== null;
  const mood = speaking ? "speaking" : state;            // talking overrides thinking/listening
  const label = mood === "idle" ? "" : mood;
  if ($("status").dataset.s !== label && !$("status").dataset.err) { $("status").textContent = label; $("status").dataset.s = label; }
  // where the eyes look
  if (ts > nextGaze) {
    if (mood === "thinking") target = {x: (Math.random() - .5) * 26, y: -14};
    else if (mood === "listening" || speaking) target = {x: (Math.random() - .5) * 6, y: 0};
    else target = {x: (Math.random() - .5) * 28, y: (Math.random() - .5) * 14};
    nextGaze = ts + (mood === "thinking" ? 900 : 1800 + Math.random() * 2600);
  }
  gaze.x += (target.x - gaze.x) * .08; gaze.y += (target.y - gaze.y) * .08;
  // blinking
  let lid = 1;
  if (ts > blinkAt) {
    const p = (ts - blinkAt) / 150;
    lid = p < 1 ? Math.abs(1 - 2 * p) : 1;
    if (p >= 1) blinkAt = ts + 2200 + Math.random() * 4200;
  }
  let open = mood === "asleep" ? .07 : mood === "listening" ? 1.12 : mood === "thinking" ? .82 : 1;
  open *= Math.max(lid, .06);
  const wide = mood === "listening" ? 1.08 : 1;
  for (const [id, cx] of [["eyeL", 130], ["eyeR", 270]]) {
    $(id).setAttribute("transform", `translate(${cx + gaze.x} ${112 + gaze.y}) scale(${wide} ${open})`);
  }
  // mouth: moves with the voice; a calm smile otherwise
  const want = speaking ? amp : 0;
  mouthOpen += (want - mouthOpen) * (want > mouthOpen ? .55 : .25);
  const m = $("mouth");
  if (state === "asleep") {
    m.setAttribute("d", "M190 212 a10 7 0 1 0 20 0 a10 7 0 1 0 -20 0");
  } else if (speaking || mouthOpen > .02) {
    const h = 5 + mouthOpen * 40, w = 92 - mouthOpen * 24, x = 200 - w / 2, y = 212 - h / 2, r = Math.min(h, w) / 2;
    m.setAttribute("d", `M${x + r} ${y} h${w - 2 * r} a${r} ${r} 0 0 1 ${r} ${r} v${h - 2 * r} a${r} ${r} 0 0 1 -${r} ${r} h-${w - 2 * r} a${r} ${r} 0 0 1 -${r} -${r} v-${h - 2 * r} a${r} ${r} 0 0 1 ${r} -${r}z`);
  } else if (mood === "thinking") {
    m.setAttribute("d", "M178 214 h44 a3 3 0 0 1 0 6 h-44 a3 3 0 0 1 0 -6z");
  } else {
    m.setAttribute("d", "M156 204 q44 26 88 0 q2 -2 4 2 q-48 34 -96 0 q2 -4 4 -2z");
  }
  // listening ring pulse
  const ring = $("ring");
  ring.setAttribute("opacity", state === "listening" ? (.25 + .2 * Math.sin(ts / 220)).toFixed(2) : "0");
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
poll();
document.body.addEventListener("click", () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); });
</script>
</body>
</html>
