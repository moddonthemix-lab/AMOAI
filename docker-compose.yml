# Phase 1: everything on your desktop PC.
#   cp .env.example .env   (set MODD_API_KEY, MODD_OWNER_NAME)
#   docker compose up -d
#   ./scripts/pull-models.sh
# Open WebUI → http://localhost:3000   Modd dashboard → http://localhost:8765

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # NVIDIA GPU? Uncomment (needs nvidia-container-toolkit / Docker Desktop GPU support):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  modd:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
      MODD_DB_PATH: /data/modd.db
    volumes:
      - ./data:/data
      - ./models:/models
    ports:
      - "8765:8765"
    depends_on:
      - ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      # Raw Ollama models (still available for plain chat)
      OLLAMA_BASE_URL: http://ollama:11434
      # Modd shows up as the "modd" model — this is the one with memory + your business tools.
      OPENAI_API_BASE_URLS: http://modd:8765/v1
      OPENAI_API_KEYS: ${MODD_API_KEY}
      DEFAULT_MODELS: modd
      # Voice: Open WebUI's mic + read-aloud go through Modd's local Whisper and Piper.
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://modd:8765/v1
      AUDIO_STT_OPENAI_API_KEY: ${MODD_API_KEY}
      AUDIO_STT_MODEL: whisper-1
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://modd:8765/v1
      AUDIO_TTS_OPENAI_API_KEY: ${MODD_API_KEY}
      AUDIO_TTS_MODEL: piper
      AUDIO_TTS_VOICE: default
      # Keep it private: no telemetry, single local user.
      ANONYMIZED_TELEMETRY: "false"
      ENABLE_SIGNUP: "true"
    depends_on:
      - modd

volumes:
  ollama:
  open-webui:
