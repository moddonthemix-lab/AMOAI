# Phase 1 on a Mac.
#
# Ollama runs NATIVELY on macOS (the Ollama app) so models use the Apple Silicon GPU —
# Docker on a Mac can't reach the GPU. AMO + Open WebUI run here and talk to it
# through host.docker.internal.
#
#   brew install ollama && brew services start ollama   (or install the Ollama app)
#   ./scripts/pull-models.sh
#   cp .env.example .env    (set AMO_API_KEY)
#   docker compose up -d --build
#
# Open WebUI → http://localhost:3000   AMO dashboard → http://localhost:8765
#
# (Linux box / Raspberry Pi later: `docker compose --profile ollama up -d` runs Ollama in
#  Docker too; set OLLAMA_URL=http://ollama:11434 in .env.)

services:
  amo:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_URL: ${AMO_DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      AMO_DB_PATH: /data/amo.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./models:/models
    ports:
      - "8765:8765"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Raw Ollama models (still available for plain chat)
      OLLAMA_BASE_URL: ${AMO_DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      # AMO shows up as the "amo" model — this is the one with memory + your business tools.
      OPENAI_API_BASE_URLS: http://amo:8765/v1
      OPENAI_API_KEYS: ${AMO_API_KEY}
      DEFAULT_MODELS: amo
      # Voice: Open WebUI's mic + read-aloud go through AMO's local Whisper and Piper.
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://amo:8765/v1
      AUDIO_STT_OPENAI_API_KEY: ${AMO_API_KEY}
      AUDIO_STT_MODEL: whisper-1
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://amo:8765/v1
      AUDIO_TTS_OPENAI_API_KEY: ${AMO_API_KEY}
      AUDIO_TTS_MODEL: piper
      AUDIO_TTS_VOICE: default
      # Keep it private: no telemetry, single local user.
      ANONYMIZED_TELEMETRY: "false"
      # Skip the extra AI calls Open WebUI makes after every reply (titles, tags, follow-ups):
      # on a CPU-only Mac they slow down your next message.
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_SIGNUP: "true"
    depends_on:
      - amo

  # Only for Linux / Raspberry Pi (Phase 2): `docker compose --profile ollama up -d`
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama:
  open-webui:
