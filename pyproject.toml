[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amo"
version = "0.1.0"
description = "AMO: a local-first personal AI operating system (Ollama + Open WebUI + SQLite + Whisper + Piper)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Speech-to-text (Whisper) and text-to-speech (Piper), run fully local.
voice = [
  "faster-whisper>=1.0",
  "piper-tts>=1.2",
  "sounddevice>=0.4",
  "numpy>=1.26",
]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
amo = "amo.cli:main"

[tool.setuptools.packages.find]
include = ["amo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
amo = ["api/static/*"]
